name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # daily at UTC midnight
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate profile images from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: '1pvq1'
          CONTRIB_START_DATE: '2022-03-19T00:00:00Z'
          TOP_LANG_COUNT: '6'
        run: |
          set -euo pipefail
          python scripts/generate_readme_stats.py

      - name: Commit generated assets
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg || true
          git commit -m "chore: update generated profile stats images [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${GIT_BRANCH}
