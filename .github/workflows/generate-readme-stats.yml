name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # daily at UTC midnight
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Fetch generated profile images
        run: |
          set -euo pipefail
          curl -fsSL -o assets/profile-overview.svg 'https://github-readme-stats.vercel.app/api?username=1pvq1&show_icons=true&theme=tokyonight'
          curl -fsSL -o assets/top-langs.svg 'https://github-readme-stats.vercel.app/api/top-langs/?username=1pvq1&layout=compact&theme=tokyonight'
          curl -fsSL -o assets/streak.svg 'https://streak-stats.demolab.com?user=1pvq1&theme=tokyonight'
          curl -fsSL -o assets/profile-details.svg 'https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=1pvq1&theme=tokyonight'
          curl -fsSL -o assets/productive-time.svg 'https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=1pvq1&theme=tokyonight'

      - name: Commit generated assets
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg || true
          git commit -m "chore: update generated profile stats images [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${GIT_BRANCH}
